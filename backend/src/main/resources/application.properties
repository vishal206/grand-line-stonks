spring.application.name=GrandLineStonks

spring.datasource.url=jdbc:postgresql://localhost:5432/grand_line_stonks
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-in-prod-0123456789abcdef}
app.jwt.expiration=${JWT_EXPIRATION:24h}
app.seed.enabled=${APP_SEED_ENABLED:false}
app.cors.frontend-origin=${FRONTEND_ORIGIN:http://localhost:3000}

management.endpoints.web.exposure.include=health,metrics
