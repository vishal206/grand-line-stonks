services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: grand_line_stonks
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d grand_line_stonks"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
